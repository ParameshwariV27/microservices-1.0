spring.application.name=currency-exchange
server.port=8000
spring.config.import=optional:configserver:

spring.jpa.show-sql=true
spring.datasource.url =jdbc:h2:mem:testdb
spring.h2.console.enabled=true

spring.jpa.defer-datasource-initialization=true

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
spring.cloud.client.hostname=localhost

##
acctId=2308c28374d0416190a49f8215d433d2
##
##ECR
eureka.client.enabled=false

##http://localhost:8761/eureka

# ======================
# RETRY CONFIGURATION
# ======================
resilience4j.retry.instances.sample-api.max-attempts=3
resilience4j.retry.instances.sample-api.wait-duration=1s


# Exponential Back off

resilience4j.retry.instances.sample-api.enable-exponential-backoff=true
resilience4j.retry.instances.sample-api.exponential-backoff-multiplier=2
# ======================
# CIRCUIT BREAKER CONFIGURATION
# ======================
resilience4j.circuitbreaker.instances.sample-api.sliding-window-size=5
resilience4j.circuitbreaker.instances.sample-api.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.sample-api.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sample-api.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.sample-api.permitted-number-of-calls-in-half-open-state=2

# ======================
# RATE LIMITING
# ======================
resilience4j.ratelimiter.instances.sample-api.limit-for-period=2
resilience4j.ratelimiter.instances.sample-api.limit-refresh-period=1s
resilience4j.ratelimiter.instances.sample-api.timeout-duration=0


# ======================
# BULK HEAD
# ======================
resilience4j.bulkhead.instances.sample-api.max-concurrent-calls=2
resilience4j.bulkhead.instances.sample-api.max-wait-duration=0



management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]



