spring.application.name=currency-conversion
server.port=8100

spring.config.import=optional:configserver:

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
spring.cloud.client.hostname=localhost


management.tracing.enabled=true
management.tracing.sampling.probability=1.0

management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# ======================
# RETRY CONFIGURATION
# ======================
resilience4j.retry.instances.conversion-api.max-attempts=3
resilience4j.retry.instances.conversion-api.wait-duration=1s

resilience4j.retry.instances.conversion-api.enable-exponential-backoff=true
resilience4j.retry.instances.conversion-api.exponential-backoff-multiplier=2

# ======================
# CIRCUIT BREAKER CONFIGURATION
# ======================
resilience4j.circuitbreaker.instances.conversion-api.sliding-window-size=5
resilience4j.circuitbreaker.instances.conversion-api.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.conversion-api.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.conversion-api.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.conversion-api.permitted-number-of-calls-in-half-open-state=2

# ======================
# RATE LIMITING
# ======================
resilience4j.ratelimiter.instances.conversion-api.limit-for-period=2
resilience4j.ratelimiter.instances.conversion-api.limit-refresh-period=5s
resilience4j.ratelimiter.instances.conversion-api.timeout-duration=0


# ======================
# BULK HEAD
# ======================
resilience4j.bulkhead.instances.conversion-api.max-concurrent-calls=2
resilience4j.bulkhead.instances.conversion-api.max-wait-duration=0
